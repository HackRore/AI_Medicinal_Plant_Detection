services:
  - type: web
    name: plantoai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: artifacts/checkpoints
      - key: PROTOTYPE_PATH
        value: artifacts/prototypes
      - key: ONNX_PATH
        value: artifacts/onnx
