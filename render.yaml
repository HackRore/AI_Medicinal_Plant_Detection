services:
  - type: web
    name: plantoai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL # Just a reminder placeholder, actually set in Dashboard
        fromContext: true
      - key: DATABASE_URL # Main SQLAlchemy Link
        fromContext: true
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
