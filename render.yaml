services:
  - type: web
    name: plantoai-backend
    env: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL # Main SQLAlchemy Link
        fromContext: true
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
