services:
  - type: web
    name: plantoai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed_all.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: plantoai_secret_2024
      - key: GEMINI_API_KEY
        value: your_key_here
      - key: USE_S3
        value: false
      - key: DATABASE_URL
        value: sqlite:///./plantoai.db
